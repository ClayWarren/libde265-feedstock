context:
  name: libde265
  version: "1.1.1"

package:
  name: ${{ name | lower }}
  version: ${{ version }}

source:
  url: https://github.com/strukturag/libde265/releases/download/v${{ version }}/libde265-${{ version }}.tar.gz
  sha256: fd48a927e94ed74fc7ce8829d222b9d8599fcbfe8b6448ba66705babc56ab219

build:
  number: 1

requirements:
  build:
    - if: unix
      then: gnuconfig
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
    - cmake
    - ninja
  run_exports:
    - ${{ pin_subpackage('libde265', upper_bound='x.x.x') }}


tests:
  - package_contents:
      lib:
        - if: unix
          then:
            - de265
      include:
        - libde265/de265.h
      files:
        - if: unix
          then:
            - lib/pkgconfig/libde265.pc
        - if: win
          then:
            - Library/lib/de265.lib
            - Library/bin/libde265.dll
        - "**/lib/cmake/libde265/libde265-config.cmake"
      bin:
        - dec265
  - script:
      - dec265 -h

  - if: win and arm64
    then:
      requirements:
        run:
          - ${{ compiler('cxx') }}
      files:
        recipe:
          - decode-test.cpp
          - black.hevc
      script:
        - cl /nologo /MD /EHsc /I"%LIBRARY_INC%" decode-test.cpp /link /LIBPATH:"%LIBRARY_LIB%" de265.lib /OUT:decode-test.exe
        - decode-test.exe
        - dumpbin /headers "%LIBRARY_BIN%\libde265.dll" | findstr /I /C:"AA64 machine (ARM64)"
        - dumpbin /headers decode-test.exe | findstr /I /C:"AA64 machine (ARM64)"

about:
  homepage: http://www.libde265.org/
  summary: Open h.265 video codec implementation
  description: |
    libde265 is an open source implementation of the h.265 video codec.
    It is written from scratch and has a plain C API to enable a simple
    integration into other software. libde265 supports WPP and tile-based
    multithreading and includes SSE optimizations. The decoder includes all
    features of the Main profile and correctly decodes almost all conformance
    streams.
  license: LGPL-3.0-or-later
  license_file: COPYING
  repository: https://github.com/strukturag/libde265

extra:
  recipe-maintainers:
    - frmdstryr
    - wolfv
